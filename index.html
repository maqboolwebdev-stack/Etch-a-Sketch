<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="styles/style.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Atma:wght@300;400;500;600;700&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Aldrich&display=swap");
    </style>
  </head>
  <body>

    <h1>Etch-A-Sketch</h1>

     <div class="range-container">
      <span class="rangeValue">16</span>
       <input class="range" type="range" value="16" min="1" max="100" step="1">
      </div>
    <div class="main">
      <div class="buttons-container">

        <div class="color-picker-container">
          <label for="">Select:</label>
          <input type="color" class="side-btn on" id="colorPicker" value="#000000">
        </div>

        <button class="random-color-btn side-btn on">Random mode</button>
        <button class="erase-color-btn side-btn on">Erase</button>
        <button class="clear-color-btn side-btn">Clear</button>
      </div>

      <div class="sketch"></div>
    </div>

    <script type="module" src="/scripts/script.js"></script>
  </body>
</html>
